<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笛卡尔函数</title>
<meta property="og:title" content="笛卡尔函数">
<meta property="og:description" content="r = 1 − cosθ">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  background:#ffffff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
canvas{
  width:92vw;
  height:92vh;
}
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>

<script>
const canvas = document.getElementById('heartCanvas');
const ctx = canvas.getContext('2d');

let t = 0;

function resize(){
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}

window.addEventListener('resize', resize);

function drawHeart(){
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;

  const baseScale = Math.min(w, h) * 0.38;
  const beatScale = 0.92 + Math.sin(t) * 0.08;
  const scale = baseScale * beatScale;

  ctx.clearRect(0, 0, w, h);

  ctx.beginPath();
  for(let th = 0; th <= 2 * Math.PI + 0.02; th += 0.008){
    const r = 1 - Math.cos(th);
    //旋转180度，摆正标准爱心，尖角朝下
    const x = cx + r * Math.cos(th + Math.PI / 2) * scale;
    const y = cy + r * Math.sin(th + Math.PI / 2) * scale;
    th === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = '#ff001e';
  ctx.shadowColor = '#ff001e';
  ctx.shadowBlur = 22;
  ctx.fill();

  t += 0.025;
  requestAnimationFrame(drawHeart);
}

resize();
drawHeart();
</script>
</body>
</html>
