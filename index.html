<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笛卡尔函数</title>
<meta property="og:title" content="笛卡尔函数">
<meta property="og:description" content="r = 1 − cosθ">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  background:#ffffff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
canvas{
  width:92vw;
  height:92vh;
}
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>

<script>
const canvas = document.getElementById('heartCanvas');
const ctx = canvas.getContext('2d');

let t = 0;

function resize(){
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}

window.addEventListener('resize', resize);

function drawHeart(){
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;

  // 控制爱心大小
  const baseScale = Math.min(w, h) * 0.38;

  // 跳动效果：scale 在 0.92 ~ 1.08 之间变化
  const beatScale = 0.92 + Math.sin(t) * 0.08;
  const scale = baseScale * beatScale;

  ctx.clearRect(0, 0, w, h);

  // 外层红光
  ctx.beginPath();
  for(let th = 0; th <= 2 * Math.PI + 0.02; th += 0.01){
    const r = 1 - Math.cos(th);

    // 让爱心正着：旋转 90 度
    const x = cx + r * Math.cos(th - Math.PI / 2) * scale;
    const y = cy - r * Math.sin(th - Math.PI / 2) * scale;

    th === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255, 0, 30, 0.12)';
  ctx.shadowColor = '#ff001e';
  ctx.shadowBlur = 45;
  ctx.fill();

  // 主体通红红心
  ctx.shadowBlur = 25;
  ctx.beginPath();
  for(let th = 0; th <= 2 * Math.PI + 0.02; th += 0.008){
    const r = 1 - Math.cos(th);

    const x = cx + r * Math.cos(th - Math.PI / 2) * scale;
    const y = cy - r * Math.sin(th - Math.PI / 2) * scale;

    th === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = '#ff001e';
  ctx.shadowColor = '#ff001e';
  ctx.shadowBlur = 30;
  ctx.fill();

  // 内层高光，让红心更立体
  ctx.shadowBlur = 12;
  ctx.beginPath();
  for(let th = 0; th <= 2 * Math.PI + 0.02; th += 0.008){
    const r = 1 - Math.cos(th);

    const x = cx + r * 0.70 * Math.cos(th - Math.PI / 2) * scale;
    const y = cy - r * 0.70 * Math.sin(th - Math.PI / 2) * scale;

    th === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255, 180, 190, 0.35)';
  ctx.shadowColor = 'rgba(255, 180, 190, 0.5)';
  ctx.shadowBlur = 18;
  ctx.fill();

  t += 0.025;
  requestAnimationFrame(drawHeart);
}

resize();
drawHeart();
</script>
</body>
</html>
