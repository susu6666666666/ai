<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笛卡尔函数</title>
<meta property="og:title" content="笛卡尔函数">
<meta property="og:description" content="r = 1 − cosθ">
<meta property="og:type" content="website">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  background:#ffffff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
canvas{
  width:92vw;
  height:92vh;
}
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>

<script>
const canvas = document.getElementById('heartCanvas');
const ctx = canvas.getContext('2d');

let t = 0;

function resize(){
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}

window.addEventListener('resize', resize);

function drawHeart(){
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;

  const baseScale = Math.min(w, h) * 0.35;
  const beatScale = 0.92 + Math.sin(t) * 0.08;
  const scale = baseScale * beatScale;

  ctx.clearRect(0, 0, w, h);

  ctx.beginPath();
  //标准正向爱心参数方程，瓣在上尖角朝下❤️
  for(let th = 0; th <= 2*Math.PI; th += 0.01){
    let x = 16 * Math.pow(Math.sin(th),3);
    let y = 13 * Math.cos(th) - 5 * Math.cos(2*th) - 2 * Math.cos(3*th) - Math.cos(4*th);
    const px = cx + x * scale * 0.045;
    const py = cy - y * scale * 0.045;
    th===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
  }
  ctx.closePath();

  ctx.fillStyle = '#ff001e';
  ctx.shadowColor = '#ff001e';
  ctx.shadowBlur = 22;
  ctx.fill();

  t += 0.025;
  requestAnimationFrame(drawHeart);
}

resize();
drawHeart();
</script>
</body>
</html>
