<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笛卡尔函数</title>
<meta property="og:title" content="笛卡尔函数">
<meta property="og:description" content="r = 1 − cosθ">
<meta property="og:type" content="website">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  background:#ffffff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
canvas{
  width:92vw;
  height:92vh;
}
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>

<script>
const canvas = document.getElementById('heartCanvas');
const ctx = canvas.getContext('2d');

let t = 0;
let stars = [];

function resize(){
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}

window.addEventListener('resize', resize);

// 创建小星星
function createStar(){
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;

  // 星星从爱心周围随机位置冒出
  const angle = Math.random() * Math.PI * 2;
  const distance = Math.random() * 160 + 80;

  return {
    x: cx + Math.cos(angle) * distance,
    y: cy + Math.sin(angle) * distance,
    size: Math.random() * 3 + 1.5,
    alpha: Math.random() * 0.6 + 0.4,
    twinkleSpeed: Math.random() * 0.02 + 0.01,
    life: 1,
    fadeSpeed: Math.random() * 0.015 + 0.008
  };
}

// 画星星
function drawStar(x, y, size, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffd700';
  ctx.shadowColor = '#ffd700';
  ctx.shadowBlur = 8;

  ctx.beginPath();
  for(let i = 0; i < 5; i++){
    const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
    const x1 = x + Math.cos(angle) * size;
    const y1 = y + Math.sin(angle) * size;
    const x2 = x + Math.cos(angle + Math.PI / 5) * size * 0.4;
    const y2 = y + Math.sin(angle + Math.PI / 5) * size * 0.4;

    i === 0 ? ctx.moveTo(x1, y1) : ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// 画一颗正着的纯红爱心
function drawHeart(){
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;

  const baseScale = Math.min(w, h) * 0.35;
  const beatScale = 0.92 + Math.sin(t) * 0.08;
  const scale = baseScale * beatScale;

  ctx.clearRect(0, 0, w, h);

  // 随机冒出新星星
  if(Math.random() < 0.35){
    stars.push(createStar());
  }

  // 更新并绘制星星
  for(let i = stars.length - 1; i >= 0; i--){
    const star = stars[i];
    star.alpha += Math.sin(t * star.twinkleSpeed * 100) * 0.015;
    star.alpha = Math.max(0.2, Math.min(1, star.alpha));
    star.life -= star.fadeSpeed;

    if(star.life <= 0){
      stars.splice(i, 1);
    }else{
      drawStar(star.x, star.y, star.size * star.life, star.alpha);
    }
  }

  // 中间通红跳动爱心
  ctx.beginPath();
  for(let th = 0; th <= 2 * Math.PI; th += 0.01){
    let x = 16 * Math.pow(Math.sin(th), 3);
    let y = 13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th);

    const px = cx + x * scale * 0.045;
    const py = cy - y * scale * 0.045;

    th === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();

  ctx.fillStyle = '#ff001e';
  ctx.shadowColor = '#ff001e';
  ctx.shadowBlur = 22;
  ctx.fill();

  t += 0.025;
  requestAnimationFrame(drawHeart);
}

resize();
drawHeart();
</script>
</body>
</html>
